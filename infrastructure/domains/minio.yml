services:
  minio:
    image: bitnami/minio:latest
    container_name: pii-minio
    environment:
      MINIO_ROOT_USER: \
      MINIO_ROOT_PASSWORD: \
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/minio:/bitnami/minio/data
    networks:
      - pii-internal

networks:
  pii-internal:
    external: true
