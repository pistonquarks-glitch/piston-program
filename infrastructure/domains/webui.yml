services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: pii-webui
    ports:
      - "3030:8080"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - WEBUI_SECRET_KEY=pii_secure_key_2026
    volumes:
      - ./data/open-webui:/app/backend/data
    networks:
      - pii-public
    restart: always

networks:
  pii-public:
    external: true
