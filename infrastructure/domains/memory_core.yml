services:
  postgres:
    image: postgres:15-alpine
    container_name: pii-postgres
    environment:
      POSTGRES_USER: pii_user
      POSTGRES_PASSWORD: pii_secure_pass
      POSTGRES_DB: pii_knowledge_base
    ports:
      - "5433:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - pii-internal

  qdrant:
    image: qdrant/qdrant:v1.7.0
    container_name: pii-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant:/qdrant/storage
    networks:
      - pii-internal

  neo4j:
    image: neo4j:5.12.0-community
    container_name: pii-neo4j
    environment:
      NEO4J_AUTH: neo4j/pii_secure_pass
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - ./data/neo4j:/data
    networks:
      - pii-internal

networks:
  pii-internal:
    driver: bridge
